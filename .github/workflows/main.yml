name: Build Jana Wailin APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip

  - name: Extract APK builder
    run: |
      unzip -o jana_wailin_apk_builder.zip -d builder
      find builder -maxdepth 3 -type f | head -100

  - name: Upload builder files for inspection
    uses: actions/upload-artifact@v4
    with:
      name: jana-wailin-builder-files
      path: builder/
      if-no-files-found: error
